# ==============================================================================
# SENTINEL-X Production & Staging Docker Compose Stack
# SECURITY NOTICE: Override all passwords and secret keys in your .env file
# before deploying to any staging or production environment.
# ==============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: sentinelx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sentinelx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinelx_dev_pass_change_in_prod}
      POSTGRES_DB: ${POSTGRES_DB:-sentinelx}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentinelx} -d ${POSTGRES_DB:-sentinelx}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sentinelx-internal

  redis:
    image: redis:7-alpine
    container_name: sentinelx-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sentinelx-internal

  api:
    build:
      context: ./backend
      dockerfile: ../infrastructure/docker/Dockerfile.api
    container_name: sentinelx-api
    restart: unless-stopped
    ports:
      # Loopback-only: the API is consumed by a same-host reverse proxy or the
      # frontend on the same host. Do not expose 0.0.0.0:8000 directly.
      - "127.0.0.1:8000:8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-sentinelx}:${POSTGRES_PASSWORD:-sentinelx_dev_pass_change_in_prod}@postgres:5432/${POSTGRES_DB:-sentinelx}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      - JWT_SECRET=${JWT_SECRET:-${JWT_SECRET_KEY:-sentinelx_jwt_secret_min_32_bytes_dev_only!}}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-${JWT_SECRET:-sentinelx_jwt_secret_min_32_bytes_dev_only!}}
      - ASSESSMENT_WORKSPACE_BASE=${ASSESSMENT_WORKSPACE_BASE:-/var/lib/sentinelx/workspaces}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-dGhpcy1pcy1hLTMyLWJ5dGUtc2VjcmV0LWtleS0xMjM0NTY=}
      - LLM_PROVIDER=${LLM_PROVIDER:-openrouter}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-anthropic/claude-3.5-sonnet}
      - CORS_ORIGINS=${CORS_ORIGINS:-["http://localhost:3000","http://127.0.0.1:3000","http://localhost:8000"]}
      # API talks to the runtime broker for cleanup on assessment cancellation.
      - BROKER_URL=${BROKER_URL:-http://broker:8001}
      - BROKER_API_KEY=${BROKER_API_KEY:?BROKER_API_KEY must be set explicitly; no default}
      - BROKER_AUTH_REQUIRED=${BROKER_AUTH_REQUIRED:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./rules:/app/rules:ro
      - workspace_data:/var/lib/sentinelx/workspaces
      - reports_data:/var/lib/sentinelx/reports
    networks:
      - sentinelx-internal
      - sentinelx-broker
      - sentinelx-public

  worker:
    build:
      context: ./backend
      dockerfile: ../infrastructure/docker/Dockerfile.worker
    container_name: sentinelx-worker
    restart: unless-stopped
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-sentinelx}:${POSTGRES_PASSWORD:-sentinelx_dev_pass_change_in_prod}@postgres:5432/${POSTGRES_DB:-sentinelx}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      - JWT_SECRET=${JWT_SECRET:-${JWT_SECRET_KEY:-sentinelx_jwt_secret_min_32_bytes_dev_only!}}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-${JWT_SECRET:-sentinelx_jwt_secret_min_32_bytes_dev_only!}}
      - ASSESSMENT_WORKSPACE_BASE=${ASSESSMENT_WORKSPACE_BASE:-/var/lib/sentinelx/workspaces}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-dGhpcy1pcy1hLTMyLWJ5dGUtc2VjcmV0LWtleS0xMjM0NTY=}
      - LLM_PROVIDER=${LLM_PROVIDER:-openrouter}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      # The worker does NOT mount the Docker socket. It talks to the runtime
      # broker over authenticated HTTP. BROKER_API_KEY must match the broker's.
      - BROKER_URL=${BROKER_URL:-http://broker:8001}
      - BROKER_API_KEY=${BROKER_API_KEY:?BROKER_API_KEY must be set explicitly; no default}
      - BROKER_AUTH_REQUIRED=${BROKER_AUTH_REQUIRED:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      broker:
        condition: service_healthy
    volumes:
      # The worker intentionally does NOT mount /var/run/docker.sock.
      # All Docker operations go through the authenticated runtime broker.
      - ./rules:/app/rules:ro
      - workspace_data:/var/lib/sentinelx/workspaces
      - reports_data:/var/lib/sentinelx/reports
    networks:
      - sentinelx-internal
      - sentinelx-broker

  # ---------------------------------------------------------------------------
  # Runtime Broker — policy-enforcing Docker boundary.
  # Holds the Docker socket; worker and API talk to it over authenticated HTTP.
  # ---------------------------------------------------------------------------
  broker:
    build:
      context: ./backend
      dockerfile: ../infrastructure/docker/Dockerfile.broker
    container_name: sentinelx-broker
    restart: unless-stopped
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - BROKER_API_KEY=${BROKER_API_KEY:?BROKER_API_KEY must be set explicitly; no default}
      - BROKER_AUTH_REQUIRED=${BROKER_AUTH_REQUIRED:-true}
      - ASSESSMENT_WORKSPACE_BASE=${ASSESSMENT_WORKSPACE_BASE:-/var/lib/sentinelx/workspaces}
      - BUILD_NETWORK_MODE=${BUILD_NETWORK_MODE:-none}
      - BROKER_MEMORY_LIMIT=${BROKER_MEMORY_LIMIT:-512m}
      - BROKER_CPUS=${BROKER_CPUS:-1.0}
      - BROKER_PIDS_LIMIT=${BROKER_PIDS_LIMIT:-100}
    ports:
      # Loopback-only: the broker is consumed by same-host workers/api only.
      - "127.0.0.1:8001:8001"
    volumes:
      # [!WARNING] The broker is the ONLY service with host Docker socket access.
      # It is a trusted policy-enforcement component. Mount read-only.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./rules:/app/rules:ro
    networks:
      # F-8: Broker is on a dedicated network separate from postgres/redis.
      # It only needs to reach the API and worker, never the control-plane
      # datastore or queue.
      - sentinelx-broker

  frontend:
    build:
      context: ./frontend
      dockerfile: ../infrastructure/docker/Dockerfile.frontend
    container_name: sentinelx-frontend
    restart: unless-stopped
    ports:
      # Loopback-only: the frontend is consumed by a same-host reverse proxy or
      # accessed directly on the host loopback. Do not expose 0.0.0.0:3000 directly.
      - "127.0.0.1:3000:80"
    depends_on:
      - api
    networks:
      - sentinelx-public

volumes:
  postgres_data:
  redis_data:
  workspace_data:
  reports_data:

networks:
  sentinelx-internal:
    internal: true
  sentinelx-broker:
    # F-8: Dedicated network for broker <-> worker/api communication.
    # The broker is NOT on sentinelx-internal, so it cannot reach postgres/redis.
    internal: true
  sentinelx-public:
    driver: bridge
