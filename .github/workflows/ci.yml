name: SENTINEL-X CI Pipeline

"on":
  push:
    branches:
      - main
      - master
      - fix/security-hardening-audit
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  backend-test:
    name: Backend Test Suite & Security Checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sentinelx
          POSTGRES_PASSWORD: sentinelx_test_password
          POSTGRES_DB: sentinelx_test
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Lint and Format Check (Ruff)
        working-directory: ./backend
        run: |
          ruff check .

      - name: Static Security Scan (Bandit)
        working-directory: ./backend
        run: |
          bandit -r app/ -ll -ii

      - name: Verify PostgreSQL Schema Migrations
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+psycopg2://sentinelx:sentinelx_test_password@localhost:5432/sentinelx_test
        run: |
          python -m alembic upgrade head

      - name: Verify PostgreSQL & Redis Service Connectivity
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+psycopg2://sentinelx:sentinelx_test_password@localhost:5432/sentinelx_test
          REDIS_URL: redis://localhost:6379/0
        run: |
          python -c "
          import redis
          from sqlalchemy import create_engine, text

          # Verify Redis service
          r = redis.from_url('redis://localhost:6379/0', socket_timeout=5)
          assert r.ping() is True
          r.set('ci_health_check', 'ok', ex=10)
          assert r.get('ci_health_check') == b'ok'
          print('Redis service connectivity verified successfully.')

          # Verify PostgreSQL migrated schema
          engine = create_engine('postgresql+psycopg2://sentinelx:sentinelx_test_password@localhost:5432/sentinelx_test')
          with engine.connect() as conn:
              table_count = conn.execute(text(\"SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public';\")).scalar()
              assert table_count > 0, 'No migrated tables found in PostgreSQL'
              print(f'PostgreSQL schema verified successfully ({table_count} tables found).')
          "

      - name: Install Security Scanners for Integration Tests
        run: |
          # 1. Gitleaks
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | sudo tar -xz -C /usr/local/bin gitleaks
          # 2. Trivy
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin
          # 3. Syft
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sudo sh -s -- -b /usr/local/bin
          # 4. Grype
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sudo sh -s -- -b /usr/local/bin
          grype db update
          # 5. OSV-Scanner (v2.7.1)
          sudo curl -sSL -o /usr/local/bin/osv-scanner https://github.com/google/osv-scanner/releases/download/v2.7.1/osv-scanner_linux_amd64 && sudo chmod +x /usr/local/bin/osv-scanner
          mkdir -p ~/.cache/osv-scalibr/PyPI
          curl -sSL -o ~/.cache/osv-scalibr/PyPI/all.zip https://osv-vulnerabilities.storage.googleapis.com/PyPI/all.zip
          # 6. Semgrep
          pip install semgrep

      - name: Run Pytest Test Suite
        working-directory: ./backend
        env:
          DATABASE_URL: sqlite:////tmp/sentinelx_ci_test.db
        run: |
          PYTHONPATH=. python -m pytest tests/ -v

  frontend-build:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: |
          npm ci

      - name: TypeScript & Build
        working-directory: ./frontend
        run: |
          npm run build
