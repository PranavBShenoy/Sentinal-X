name: SENTINEL-X CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Test Suite & Security Checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sentinelx
          POSTGRES_PASSWORD: sentinelx_test_password
          POSTGRES_DB: sentinelx_test
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pytest pytest-cov ruff bandit

      - name: Lint and Format Check (Ruff)
        working-directory: ./backend
        run: |
          ruff check . || true

      - name: Static Security Scan (Bandit)
        working-directory: ./backend
        run: |
          bandit -r app/ -ll -ii || true

      - name: Database Migrations Check
        working-directory: ./backend
        env:
          DATABASE_URL: sqlite:////tmp/sentinelx_ci.db
        run: |
          alembic upgrade head

      - name: Run Pytest Test Suite
        working-directory: ./backend
        env:
          DATABASE_URL: sqlite:////tmp/sentinelx_ci_test.db
          JWT_SECRET_KEY: test_secret_key_for_ci_pipeline_32bytes!
          ENCRYPTION_KEY: dGhpcy1pcy1hLTMyLWJ5dGUtc2VjcmV0LWtleS0xMjM0NTY=
        run: |
          PYTHONPATH=. python -m pytest tests/ -v

  frontend-build:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: |
          npm ci

      - name: TypeScript & Build
        working-directory: ./frontend
        run: |
          npm run build
